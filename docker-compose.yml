version: '3.8'

services:
  # ============================================================================
  # Database Service: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: preventx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-preventx_db}
      POSTGRES_USER: ${POSTGRES_USER:-preventx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preventx_secure_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - preventx-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preventx_user} -d ${POSTGRES_DB:-preventx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Notice: Ports are NOT mapped to host publicly by default for security.

  # ============================================================================
  # Cache & Broker Service: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: preventx-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - preventx-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Backend API Engine: FastAPI (Python 3.10)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: preventx-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_NAME=PREVENT-X
      - APP_VERSION=1.0.0
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-preventx_user}:${POSTGRES_PASSWORD:-preventx_secure_pass}@postgres:5432/${POSTGRES_DB:-preventx_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-preventx-prod-secret-key-replace-in-production-32c!}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-preventx-bootstrap-token-prod-2026}
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=lax
      - CSRF_PROTECTION_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - preventx-internal-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Background Worker Service: Celery
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: preventx-celery-worker
    command: celery -A backend.app.workers.celery_app.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_NAME=PREVENT-X
      - DATABASE_URL=postgresql://${POSTGRES_USER:-preventx_user}:${POSTGRES_PASSWORD:-preventx_secure_pass}@postgres:5432/${POSTGRES_DB:-preventx_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-preventx-prod-secret-key-replace-in-production-32c!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - preventx-internal-net

  # ============================================================================
  # Frontend Application: React / Vite SPA
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: preventx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - preventx-internal-net

  # ============================================================================
  # Edge Gateway & Reverse Proxy: Nginx
  # ============================================================================
  nginx:
    image: nginx:alpine-slim
    container_name: preventx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - preventx-internal-net

# ==============================================================================
# Persistent Named Volumes & Internal Bridge Network
# ==============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  preventx-internal-net:
    driver: bridge

